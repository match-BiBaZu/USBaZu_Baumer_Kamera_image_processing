[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bibazu-vision"
version = "0.1.0"
description = "Trainingsfreie Baumer-Kamera-Winkelmessung und Durchlaufkontrolle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.10,<5", "PyQt6>=6.6,<7", "harvesters>=1.4.3,<2", "genicam>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
bibazu-vision = "bibazu_vision.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bibazu_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
